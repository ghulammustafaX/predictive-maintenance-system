# Isolated Module 03 Kafka-to-InfluxDB verification only.
# This file intentionally does NOT reference docker-compose.yml, external volumes,
# production container names, published host ports, or production credentials.
# Run using an explicit project name, e.g. -p pms-ci-m3.
services:
  zookeeper:
    image: confluentinc/cp-zookeeper:7.4.0
    environment:
      ZOOKEEPER_CLIENT_PORT: "2181"
      ZOOKEEPER_TICK_TIME: "2000"
    healthcheck:
      test: ["CMD-SHELL", "echo srvr | nc -w 2 127.0.0.1 2181 | grep -Eq '^Mode: (standalone|leader|follower)'"]
      interval: 5s
      timeout: 4s
      retries: 24
      start_period: 5s

  kafka:
    image: confluentinc/cp-kafka:7.4.0
    depends_on:
      zookeeper:
        condition: service_healthy
    environment:
      KAFKA_BROKER_ID: "1"
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: "1"
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
    healthcheck:
      test: ["CMD-SHELL", "kafka-topics --bootstrap-server kafka:9092 --list >/dev/null 2>&1"]
      interval: 5s
      timeout: 10s
      retries: 24

  topic-init:
    image: confluentinc/cp-kafka:7.4.0
    depends_on:
      kafka:
        condition: service_healthy
    entrypoint: ["/bin/bash", "-ec"]
    command:
      - |
        kafka-topics --bootstrap-server kafka:9092 --create --topic m3-isolated-telemetry --partitions 1 --replication-factor 1
        kafka-topics --bootstrap-server kafka:9092 --create --topic m3-isolated-dead-letter --partitions 1 --replication-factor 1
        kafka-topics --bootstrap-server kafka:9092 --create --topic m3-batch-telemetry --partitions 1 --replication-factor 1
        kafka-topics --bootstrap-server kafka:9092 --create --topic m3-batch-dead-letter --partitions 1 --replication-factor 1
        kafka-topics --bootstrap-server kafka:9092 --create --topic m3-e2e-legacy-telemetry --partitions 1 --replication-factor 1
        kafka-topics --bootstrap-server kafka:9092 --create --topic m3-e2e-batch-telemetry --partitions 1 --replication-factor 1
        kafka-topics --bootstrap-server kafka:9092 --create --topic m3-inflight-telemetry --partitions 1 --replication-factor 1

  influxdb:
    image: influxdb:2.7
    environment:
      DOCKER_INFLUXDB_INIT_MODE: setup
      DOCKER_INFLUXDB_INIT_USERNAME: m3-test-user
      DOCKER_INFLUXDB_INIT_PASSWORD: m3-isolated-password-123
      DOCKER_INFLUXDB_INIT_ORG: m3-isolated-org
      DOCKER_INFLUXDB_INIT_BUCKET: m3-isolated-bucket
      DOCKER_INFLUXDB_INIT_ADMIN_TOKEN: m3-isolated-token
    healthcheck:
      test: ["CMD", "influx", "ping"]
      interval: 5s
      timeout: 5s
      retries: 30

  consumer:
    build: ./ingestion
    command: ["python", "src/kafka_consumer.py"]
    restart: on-failure
    depends_on:
      topic-init:
        condition: service_completed_successfully
      influxdb:
        condition: service_healthy
    environment:
      KAFKA_BROKER: kafka:9092
      SENSOR_TOPIC: m3-isolated-telemetry
      DEAD_LETTER_TOPIC: m3-isolated-dead-letter
      CONSUMER_GROUP: m3-isolated-consumer
      INFLUXDB_URL: http://influxdb:8086
      INFLUXDB_TOKEN: m3-isolated-token
      INFLUXDB_ORG: m3-isolated-org
      INFLUXDB_BUCKET: m3-isolated-bucket
      INFLUX_MAX_WRITE_RETRIES: "3"
      KAFKA_MAX_POLL_RECORDS: "5"

  verifier:
    build: ./ingestion
    entrypoint: ["python", "/tests/module3_storage_probe.py"]
    volumes:
      - ./tests/module3_storage_probe.py:/tests/module3_storage_probe.py:ro
    depends_on:
      topic-init:
        condition: service_completed_successfully
      influxdb:
        condition: service_healthy
    environment:
      MODULE3_TEST_GUARD: m3-isolated-only
      KAFKA_BROKER: kafka:9092
      SENSOR_TOPIC: m3-isolated-telemetry
      DEAD_LETTER_TOPIC: m3-isolated-dead-letter
      CONSUMER_GROUP: m3-isolated-consumer
      INFLUXDB_URL: http://influxdb:8086
      INFLUXDB_TOKEN: m3-isolated-token
      INFLUXDB_ORG: m3-isolated-org
      INFLUXDB_BUCKET: m3-isolated-bucket

  query-verifier:
    build: ./backend
    entrypoint: ["python", "/tests/module3_query_probe.py"]
    volumes:
      - ./tests/module3_query_probe.py:/tests/module3_query_probe.py:ro
    depends_on:
      influxdb:
        condition: service_healthy
    environment:
      MODULE3_TEST_GUARD: m3-isolated-query-only
      PYTHONPATH: /app
      INFLUXDB_URL: http://influxdb:8086
      INFLUXDB_TOKEN: m3-isolated-token
      INFLUXDB_ORG: m3-isolated-org
      INFLUXDB_BUCKET: m3-isolated-bucket
      DATABASE_URL: sqlite:////tmp/module3-query-verifier.sqlite

  policy-verifier:
    build: ./backend
    entrypoint: ["python", "/tests/module3_bucket_policy_probe.py"]
    volumes:
      - ./tests/module3_bucket_policy_probe.py:/tests/module3_bucket_policy_probe.py:ro
      - ./storage/influx_init/bucket_policy.py:/storage/bucket_policy.py:ro
    depends_on:
      influxdb:
        condition: service_healthy
    environment:
      MODULE3_POLICY_TEST_GUARD: isolated-m3-bucket-policy-only
      INFLUXDB_URL: http://influxdb:8086
      INFLUXDB_TOKEN: m3-isolated-token
      INFLUXDB_ORG: m3-isolated-org
      INFLUXDB_BUCKET: m3-isolated-bucket

  downsample-verifier:
    build: ./backend
    entrypoint: ["python", "/tests/module3_downsample_probe.py"]
    volumes:
      - ./tests/module3_downsample_probe.py:/tests/module3_downsample_probe.py:ro
      - ./storage/influx_init/bucket_policy.py:/storage/bucket_policy.py:ro
      - ./storage/influx_init/downsample_task.py:/storage/downsample_task.py:ro
    depends_on:
      influxdb:
        condition: service_healthy
    environment:
      MODULE3_DOWNSAMPLE_GUARD: isolated-m3-downsampling-only
      INFLUXDB_URL: http://influxdb:8086
      INFLUXDB_TOKEN: m3-isolated-token
      INFLUXDB_ORG: m3-isolated-org
      INFLUXDB_BUCKET: m3-isolated-bucket

  batch-worker:
    build: ./ingestion
    command: ["python", "src/kafka_batch_consumer.py"]
    restart: "no"
    depends_on:
      topic-init:
        condition: service_completed_successfully
      influxdb:
        condition: service_healthy
    environment:
      PMS_BATCH_WORKER_CONFIRM: opt-in-isolated-batch-worker
      PMS_INFLUX_BATCH_SIZE: "3"
      KAFKA_BROKER: kafka:9092
      SENSOR_TOPIC: m3-batch-telemetry
      DEAD_LETTER_TOPIC: m3-batch-dead-letter
      CONSUMER_GROUP: m3-batch-writer-group
      KAFKA_MAX_POLL_RECORDS: "15"
      INFLUXDB_URL: http://influxdb:8086
      INFLUXDB_TOKEN: m3-isolated-token
      INFLUXDB_ORG: m3-isolated-org
      INFLUXDB_BUCKET: m3-isolated-bucket

  batch-verifier:
    build: ./ingestion
    entrypoint: ["python", "/tests/module3_batch_probe.py"]
    volumes:
      - ./tests/module3_batch_probe.py:/tests/module3_batch_probe.py:ro
    environment:
      MODULE3_BATCH_TEST_GUARD: m3-isolated-batch-only
      KAFKA_BROKER: kafka:9092
      SENSOR_TOPIC: m3-batch-telemetry
      DEAD_LETTER_TOPIC: m3-batch-dead-letter
      CONSUMER_GROUP: m3-batch-writer-group
      INFLUXDB_URL: http://influxdb:8086
      INFLUXDB_TOKEN: m3-isolated-token
      INFLUXDB_ORG: m3-isolated-org
      INFLUXDB_BUCKET: m3-isolated-bucket
    depends_on:
      topic-init:
        condition: service_completed_successfully
      influxdb:
        condition: service_healthy
 
  write-benchmark:
    build: ./backend
    entrypoint: ["python", "/tests/module3_write_benchmark.py"]
    volumes:
      - ./tests/module3_write_benchmark.py:/tests/module3_write_benchmark.py:ro
    depends_on:
      influxdb:
        condition: service_healthy
    environment:
      MODULE3_BENCH_GUARD: m3-isolated-write-benchmark-only
      INFLUXDB_URL: http://influxdb:8086
      INFLUXDB_TOKEN: m3-isolated-token
      INFLUXDB_ORG: m3-isolated-org
      INFLUXDB_BUCKET: m3-isolated-bucket
  
  e2e-legacy-worker:
    build: ./ingestion
    command: ["python", "src/kafka_consumer.py"]
    restart: "no"
    depends_on:
      topic-init:
        condition: service_completed_successfully
      influxdb:
        condition: service_healthy
    environment:
      KAFKA_BROKER: kafka:9092
      SENSOR_TOPIC: m3-e2e-legacy-telemetry
      DEAD_LETTER_TOPIC: m3-isolated-dead-letter
      CONSUMER_GROUP: m3-e2e-legacy-group
      KAFKA_MAX_POLL_RECORDS: "40"
      INFLUXDB_URL: http://influxdb:8086
      INFLUXDB_TOKEN: m3-isolated-token
      INFLUXDB_ORG: m3-isolated-org
      INFLUXDB_BUCKET: m3-isolated-bucket

  e2e-batch-worker:
    build: ./ingestion
    command: ["python", "src/kafka_batch_consumer.py"]
    restart: "no"
    depends_on:
      topic-init:
        condition: service_completed_successfully
      influxdb:
        condition: service_healthy
    environment:
      PMS_BATCH_WORKER_CONFIRM: opt-in-isolated-batch-worker
      PMS_INFLUX_BATCH_SIZE: "20"
      KAFKA_BROKER: kafka:9092
      SENSOR_TOPIC: m3-e2e-batch-telemetry
      DEAD_LETTER_TOPIC: m3-isolated-dead-letter
      CONSUMER_GROUP: m3-e2e-batch-group
      KAFKA_MAX_POLL_RECORDS: "40"
      INFLUXDB_URL: http://influxdb:8086
      INFLUXDB_TOKEN: m3-isolated-token
      INFLUXDB_ORG: m3-isolated-org
      INFLUXDB_BUCKET: m3-isolated-bucket

  e2e-verifier:
    build: ./ingestion
    entrypoint: ["python", "/tests/module3_e2e_restart_probe.py"]
    volumes:
      - ./tests/module3_e2e_restart_probe.py:/tests/module3_e2e_restart_probe.py:ro
    depends_on:
      topic-init:
        condition: service_completed_successfully
      influxdb:
        condition: service_healthy
    environment:
      MODULE3_E2E_GUARD: m3-isolated-e2e-only
      KAFKA_BROKER: kafka:9092
      INFLUXDB_URL: http://influxdb:8086
      INFLUXDB_TOKEN: m3-isolated-token
      INFLUXDB_ORG: m3-isolated-org
      INFLUXDB_BUCKET: m3-isolated-bucket
  
  inflight-kill-worker:
    build: ./ingestion
    # The faulting Python process must NOT be PID 1 in its PID namespace:
    # Docker's init process has special Linux signal semantics. The shell
    # waits for the child and propagates the child SIGKILL exit code 137.
    entrypoint: ["sh", "-c", "python /tests/module3_inflight_kill_worker.py & wait $!"]
    restart: "no"
    volumes:
      - ./tests/module3_inflight_kill_worker.py:/tests/module3_inflight_kill_worker.py:ro
    depends_on:
      topic-init:
        condition: service_completed_successfully
      influxdb:
        condition: service_healthy
    environment:
      MODULE3_INFLIGHT_FAULT_GUARD: m3-isolated-crash-after-ack-only
      PMS_BATCH_WORKER_CONFIRM: opt-in-isolated-batch-worker
      PMS_INFLUX_BATCH_SIZE: "6"
      KAFKA_MAX_POLL_RECORDS: "12"
      KAFKA_BROKER: kafka:9092
      SENSOR_TOPIC: m3-inflight-telemetry
      DEAD_LETTER_TOPIC: m3-isolated-dead-letter
      CONSUMER_GROUP: m3-inflight-group
      INFLUXDB_URL: http://influxdb:8086
      INFLUXDB_TOKEN: m3-isolated-token
      INFLUXDB_ORG: m3-isolated-org
      INFLUXDB_BUCKET: m3-isolated-bucket

  inflight-recovery-worker:
    build: ./ingestion
    command: ["python", "src/kafka_batch_consumer.py"]
    restart: "no"
    depends_on:
      topic-init:
        condition: service_completed_successfully
      influxdb:
        condition: service_healthy
    environment:
      PMS_BATCH_WORKER_CONFIRM: opt-in-isolated-batch-worker
      PMS_INFLUX_BATCH_SIZE: "6"
      KAFKA_MAX_POLL_RECORDS: "12"
      KAFKA_BROKER: kafka:9092
      SENSOR_TOPIC: m3-inflight-telemetry
      DEAD_LETTER_TOPIC: m3-isolated-dead-letter
      CONSUMER_GROUP: m3-inflight-group
      INFLUXDB_URL: http://influxdb:8086
      INFLUXDB_TOKEN: m3-isolated-token
      INFLUXDB_ORG: m3-isolated-org
      INFLUXDB_BUCKET: m3-isolated-bucket

  inflight-verifier:
    build: ./ingestion
    entrypoint: ["python", "/tests/module3_inflight_probe.py"]
    volumes:
      - ./tests/module3_inflight_probe.py:/tests/module3_inflight_probe.py:ro
    environment:
      MODULE3_INFLIGHT_PROBE_GUARD: m3-isolated-inflight-probe-only
      KAFKA_BROKER: kafka:9092
      INFLUXDB_URL: http://influxdb:8086
      INFLUXDB_TOKEN: m3-isolated-token
      INFLUXDB_ORG: m3-isolated-org
      INFLUXDB_BUCKET: m3-isolated-bucket

