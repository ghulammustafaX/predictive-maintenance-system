name: Module 06 offline acceptance
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  module6-offline:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install constrained CPU dependencies
        run: |
          python -m pip install 'torch>=2.6,<3' --index-url https://download.pytorch.org/whl/cpu
          python -m pip install 'pytest>=9,<10' 'numpy>=2.1,<3' 'pandas>=2.2,<4' \
            'scikit-learn>=1.6,<2' 'pyarrow>=19,<25' 'kafka-python>=2.3,<3' \
            'fastapi>=0.110,<1' 'uvicorn[standard]>=0.29,<1' \
            'influxdb-client>=1.38,<2' 'pydantic>=2,<3'
          python -m pip check
      - name: Run offline acceptance checks
        shell: bash
        run: |
          set -euo pipefail
          work=$(mktemp -d "$RUNNER_TEMP/module6-offline.XXXXXXXX")
          trap 'rm -rf -- "$work"' EXIT
          mkdir "$work/repo"
          tar --exclude=.git -cf - . | tar -xf - -C "$work/repo"
          cd "$work/repo"
          python -m pytest -p no:cacheprovider --basetemp="$work/pytest" -q -rs --tb=short \
            tests/module06_focused_checks.py \
            tests/module06_inference_validation_checks.py \
            tests/module06_dataset_validation_checks.py \
            tests/module06_checkpoint_evaluation_checks.py \
            tests/module06_compose_guard_checks.py \
            tests/test_prediction_contiguity.py \
            tests/test_prediction_checkpoint.py \
            tests/test_sequence_validation.py \
            tests/test_phase2_sequence_classification.py \
            tests/test_artifact_line_endings.py \
            tests/module05_feature_checks.py \
            tests/module05_dataset_checks.py \
            tests/module05_phase3_checks.py \
            tests/module05_integrity_checks.py \
            tests/module04_generator_checks.py \
            tests/module04_algorithm_checks.py \
            tests/module04_safety_checks.py \
            tests/module04_leakage_checks.py
