name: Module 04 isolated Kafka acceptance
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  module4-offline:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Module 04 test dependencies
        run: python -m pip install pytest -r ml/streaming/requirements.txt
      - name: Run focused Module 04 checks
        run: |
          python -m pytest -q \
            tests/module04_compose_guard_checks.py \
            tests/module04_generator_checks.py \
            tests/module04_algorithm_checks.py \
            tests/module04_safety_checks.py \
            tests/module04_leakage_checks.py
  module4-kafka:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      M4_PROJECT: pms-m4-${{ github.run_id }}-${{ github.run_attempt }}
      M4_GROUP: m4-acceptance-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@v4
      - name: Validate hosted runner and isolated configuration
        shell: bash
        run: |
          set -euo pipefail
          test "${RUNNER_ENVIRONMENT:-}" = github-hosted
          [[ "$M4_PROJECT" =~ ^pms-m4-[0-9]+-[0-9]+$ ]]
          test "$(awk '/^MemAvailable:/ {print $2}' /proc/meminfo)" -ge 4194304
          test "$(df -Pk "$PWD" | awk 'NR == 2 {print $4}')" -ge 10485760
          test "$(nproc)" -ge 2
          docker compose -p "$M4_PROJECT" -f docker-compose.module4-verification.yml config --format json > "$RUNNER_TEMP/m4-compose.json"
          python tests/module04_compose_guard.py "$RUNNER_TEMP/m4-compose.json"
      - name: Start isolated Kafka and create test topics
        run: |
          set -euo pipefail
          docker compose -p "$M4_PROJECT" -f docker-compose.module4-verification.yml up -d --wait --wait-timeout 180 kafka
          timeout 120 docker compose -p "$M4_PROJECT" -f docker-compose.module4-verification.yml run --rm --no-deps topic-init
      - name: Exercise preprocessing and durable offset behavior
        run: |
          set -euo pipefail
          compose=(docker compose -p "$M4_PROJECT" -f docker-compose.module4-verification.yml)
          timeout 300 "${compose[@]}" up -d --no-deps --build worker
          timeout 180 "${compose[@]}" run --rm --no-deps --build probe
          "${compose[@]}" logs --no-color worker > "$RUNNER_TEMP/m4-worker.log"
          test "$(grep -c 'preprocessing_partition_failed .*offset=2' "$RUNNER_TEMP/m4-worker.log" || true)" -ge 2
          grep -q 'preprocessing_partition_retry' "$RUNNER_TEMP/m4-worker.log"
      - name: Print isolated service diagnostics on failure
        if: failure()
        run: |
          [[ "$M4_PROJECT" =~ ^pms-m4-[0-9]+-[0-9]+$ ]] || exit 1
          docker compose -p "$M4_PROJECT" -f docker-compose.module4-verification.yml ps -a
          docker compose -p "$M4_PROJECT" -f docker-compose.module4-verification.yml logs --no-color --tail=80 worker
      - name: Remove only this test project
        if: always()
        run: |
          [[ "$M4_PROJECT" =~ ^pms-m4-[0-9]+-[0-9]+$ ]] || exit 1
          docker compose -p "$M4_PROJECT" -f docker-compose.module4-verification.yml down --volumes --remove-orphans
