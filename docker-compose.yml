name: predictive-maintenance-system

services:

  # ─── ZOOKEEPER (required by Kafka) ───────────────────────────
  zookeeper:
    image: confluentinc/cp-zookeeper:7.4.0
    container_name: pms-zookeeper
    volumes:
      - zookeeper-data:/var/lib/zookeeper/data
      - zookeeper-log:/var/lib/zookeeper/log
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - "2181:2181"
    networks:
      - pms-network

  # ─── KAFKA BROKER ────────────────────────────────────────────
  kafka:
    image: confluentinc/cp-kafka:7.4.0
    container_name: pms-kafka
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    volumes:
      - kafka-data:/var/lib/kafka/data
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    networks:
      - pms-network

  kafka-topic-init:
    image: confluentinc/cp-kafka:7.4.0
    container_name: pms-kafka-topic-init
    depends_on:
      - kafka
    entrypoint: ["/bin/bash", "-c"]
    command:
      - >-
        until kafka-topics --bootstrap-server kafka:9092 --list >/dev/null 2>&1;
        do sleep 2; done;
        kafka-topics --bootstrap-server kafka:9092 --create --if-not-exists --topic sensor-telemetry --partitions 1 --replication-factor 1;
        kafka-topics --bootstrap-server kafka:9092 --create --if-not-exists --topic preprocessed-telemetry --partitions 1 --replication-factor 1;
        kafka-topics --bootstrap-server kafka:9092 --create --if-not-exists --topic rul-predictions --partitions 1 --replication-factor 1;
        kafka-topics --bootstrap-server kafka:9092 --create --if-not-exists --topic sensor-telemetry-dead-letter --partitions 1 --replication-factor 1 --config retention.ms=604800000;
        kafka-topics --bootstrap-server kafka:9092 --create --if-not-exists --topic bearing-telemetry --partitions 1 --replication-factor 1
    networks:
      - pms-network

  # ─── MQTT BROKER (Mosquitto) ─────────────────────────────────
  mosquitto:
    image: eclipse-mosquitto:2.0
    container_name: pms-mosquitto
    ports:
      - "1883:1883"
    volumes:
      - ./mosquitto/config/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - mosquitto-data:/mosquitto/data
      - mosquitto-log:/mosquitto/log
    networks:
      - pms-network
    healthcheck:
      test: ["CMD-SHELL", "mosquitto_sub -t '$$SYS/broker/version' -C 1 -W 2 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ─── INFLUXDB ─────────────────────────────────────────────────
  influxdb:
    image: influxdb:2.7
    container_name: pms-influxdb
    ports:
      - "8086:8086"
    environment:
      DOCKER_INFLUXDB_INIT_MODE: setup
      DOCKER_INFLUXDB_INIT_USERNAME: ${INFLUXDB_USERNAME}
      DOCKER_INFLUXDB_INIT_PASSWORD: ${INFLUXDB_PASSWORD}
      DOCKER_INFLUXDB_INIT_ORG: ${INFLUXDB_ORG}
      DOCKER_INFLUXDB_INIT_BUCKET: ${INFLUXDB_BUCKET}
      DOCKER_INFLUXDB_INIT_ADMIN_TOKEN: ${INFLUXDB_TOKEN}
    volumes:
      - influxdb-data:/var/lib/influxdb2
    networks:
      - pms-network

  # ─── POSTGRESQL (Module 8 — user accounts, RBAC, audit log) ──
  postgres:
    image: postgres:16-alpine
    container_name: pms-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5433:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - pms-network

  # ─── DASHBOARD API (InfluxDB query layer + Module 8 Auth/RBAC) ─
  backend:
    build: ./backend
    container_name: pms-backend
    depends_on:
      influxdb:
        condition: service_started
      postgres:
        condition: service_healthy
    ports:
      - "8000:8000"
    environment:
      INFLUXDB_URL: http://influxdb:8086
      INFLUXDB_TOKEN: ${INFLUXDB_TOKEN}
      INFLUXDB_ORG: ${INFLUXDB_ORG}
      INFLUXDB_BUCKET: ${INFLUXDB_BUCKET}
      DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      JWT_SECRET: ${JWT_SECRET}
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-30}
      REFRESH_TOKEN_EXPIRE_DAYS: ${REFRESH_TOKEN_EXPIRE_DAYS:-7}
      PASSWORD_MIN_LENGTH: ${PASSWORD_MIN_LENGTH:-8}
      SMTP_HOST: ${SMTP_HOST}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER}
      SMTP_PASSWORD: ${SMTP_PASSWORD}
      SMTP_FROM: ${SMTP_FROM}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:5500/frontend/authentication}
    networks:
      - pms-network

      # ─── KAFKA CONSUMER → INFLUXDB ──────────────────────────────
  consumer:
    build: ./ingestion
    container_name: pms-consumer
    restart: on-failure
    depends_on:
      - kafka
      - influxdb
    environment:
      KAFKA_BROKER: kafka:9092
      SENSOR_TOPIC: sensor-telemetry
      INFLUXDB_URL: http://influxdb:8086
      INFLUXDB_TOKEN: ${INFLUXDB_TOKEN}
      INFLUXDB_ORG: ${INFLUXDB_ORG}
      INFLUXDB_BUCKET: ${INFLUXDB_BUCKET}
      INFLUX_TIMEOUT_MS: "10000"
      KAFKA_MAX_POLL_RECORDS: "5"
      KAFKA_MAX_POLL_INTERVAL_MS: "600000"
      KAFKA_COMMIT_TIMEOUT_MS: "10000"
    networks:
      - pms-network

  # ─── RUL PREDICTION SERVICE ─────────────────────────────────
  prediction:
    build:
      context: .
      dockerfile: ml/prediction/Dockerfile
    container_name: pms-prediction
    scale: 1
    depends_on:
      kafka-topic-init:
        condition: service_completed_successfully
      influxdb:
        condition: service_started
    ports:
      - "8001:8001"
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      PREDICTION_INPUT_TOPIC: preprocessed-telemetry
      PREDICTION_OUTPUT_TOPIC: rul-predictions
      PREDICTION_CHECKPOINT_PATH: /var/lib/pms-prediction/prediction.sqlite
      RUL_CHECKPOINT_PATH: /app/ml/saved/checkpoints/raw/lstm_raw_20260626T082955Z.pt
      INFLUXDB_URL: http://influxdb:8086
      INFLUXDB_TOKEN: ${INFLUXDB_TOKEN}
      INFLUXDB_ORG: ${INFLUXDB_ORG}
      INFLUXDB_BUCKET: ${INFLUXDB_BUCKET}
    volumes:
      - prediction-checkpoint:/var/lib/pms-prediction
    networks:
      - pms-network

  preprocessing:
    build:
      context: .
      dockerfile: ml/streaming/Dockerfile
    container_name: pms-preprocessing
    # Supported only on one host, with all owners using this same local volume.
    scale: 1
    depends_on:
      kafka-topic-init:
        condition: service_completed_successfully
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      PREPROCESSING_INPUT_TOPIC: sensor-telemetry
      PREPROCESSING_OUTPUT_TOPIC: preprocessed-telemetry
      PREPROCESSING_ARTIFACT_DIR: /app/ml/saved_v2_a1/scalers
      PREPROCESSING_CHECKPOINT_PATH: /var/lib/pms-preprocessing/preprocessing.sqlite
    volumes:
      - preprocessing-checkpoint:/var/lib/pms-preprocessing
    networks:
      - pms-network

  # ─── SIMULATOR ──────────────────────────────────────────────
  simulator:
    build: ./simulator
    container_name: pms-simulator
    depends_on:
      kafka-topic-init:
        condition: service_completed_successfully
      mosquitto:
        condition: service_healthy
    environment:
      KAFKA_BROKER: kafka:9092
      SENSOR_TOPIC: sensor-telemetry
      BEARING_TOPIC: bearing-telemetry
      DATASET_ID: ${SIMULATOR_DATASET_ID:-FD001}
      SOURCE_SPLIT: ${SIMULATOR_SOURCE_SPLIT:-train}
      STREAM_INTERVAL: ${SIMULATOR_STREAM_INTERVAL:-0.01}
      REPLAY_MODE: ${SIMULATOR_REPLAY_MODE:-single}
      MAX_REPLAY_CYCLES: ${SIMULATOR_MAX_REPLAY_CYCLES:-0}
      REPLAY_PAUSE_SECONDS: ${SIMULATOR_REPLAY_PAUSE_SECONDS:-1.0}
      PUBLISH_TRANSPORT: ${SIMULATOR_PUBLISH_TRANSPORT:-kafka}
      MQTT_BROKER: mosquitto
      MQTT_PORT: 1883
      MQTT_TOPIC_CMAPSS: pms/telemetry/cmapss
      MQTT_TOPIC_IMS: pms/telemetry/ims
      MQTT_QOS: 1
      RUL_CAP: 125
      UNRAR_TOOL: unrar
      CMAPSS_DATA_DIR: /app/data/cmapss
      IMS_DATA_DIR: /app/data/ims
    volumes:
      - ./simulator/data:/app/data
    networks:
      - pms-network
    restart: "no"

  # ─── MQTT-TO-KAFKA BRIDGE ───────────────────────────────────
  mqtt-bridge:
    build: ./ingestion
    container_name: pms-mqtt-bridge
    command: ["python", "src/mqtt_bridge.py"]
    depends_on:
      kafka-topic-init:
        condition: service_completed_successfully
      mosquitto:
        condition: service_healthy
    environment:
      KAFKA_BROKER: kafka:9092
      SENSOR_TOPIC: sensor-telemetry
      BEARING_TOPIC: bearing-telemetry
      DEAD_LETTER_TOPIC: sensor-telemetry-dead-letter
      MQTT_BROKER: mosquitto
      MQTT_PORT: 1883
      MQTT_TOPIC_CMAPSS: pms/telemetry/cmapss
      MQTT_TOPIC_IMS: pms/telemetry/ims
      MQTT_QOS: 1
    networks:
      - pms-network
    restart: on-failure

networks:
  pms-network:
    driver: bridge

volumes:
  kafka-data:
    name: predictive-maintenance-system_kafka-data
    external: true
  zookeeper-data:
    name: predictive-maintenance-system_zookeeper-data
    external: true
  zookeeper-log:
    name: predictive-maintenance-system_zookeeper-log
    external: true
  influxdb-data:
  postgres-data:
  prediction-checkpoint:
  preprocessing-checkpoint:
  mosquitto-data:
  mosquitto-log:
