# Mosquitto MQTT broker configuration for PMS
# Used by Module 1 (simulator) and Module 2 (MQTT-Kafka bridge)

# Network
listener 1883
protocol mqtt

# Allow anonymous connections (use auth in production)
allow_anonymous true

# Persistence
persistence true
persistence_location /mosquitto/data/

# Logging
log_dest file /mosquitto/log/mosquitto.log
log_dest stdout
log_type error
log_type warning
log_type notice
log_type information
log_timestamp true

# Connection limits
max_connections -1
max_keepalive 300

# Message size (10 MB to accommodate IMS raw sample chunks)
message_size_limit 10485760
